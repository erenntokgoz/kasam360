name: Otonom cPanel Dağıtım ve Yeniden Başlatma

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Klonlama
        uses: actions/checkout@v4

      - name: Otonom Yeniden Başlatma Tetikleyicisi (Cold-Start Payload)
        run: |
          mkdir -p tmp
          date > tmp/restart.txt

      - name: cPanel FTP Senkronizasyonu
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/health/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
