[package]
name = "kasam360-core"
version = "0.1.0"
description = "Kasam360 Desktop Core"
edition = "2021"

[lib]
name = "kasam360_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# G6 · Item 22: Property-based test (proptest).
# Testlere değil üretime değil; bu satır `dev-dependencies` altında yer alır
# ve sadece `cargo test` derlemesine girer. Prodüksiyon bağımlılığı artırmaz.
[dev-dependencies]
proptest = "1"

[dependencies]
tauri = { version = "2", features = [] }
# G6 · Item 24: Auto-updater. `updater` feature ile birlikte gelen
# `tauri::updater` modülü imzalı paket doğrulaması yapar; manifest URL
# `tauri.conf.json` içindeki `updater` bloğundan okunur.
tauri-plugin-updater = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
validator = { version = "0.18", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
