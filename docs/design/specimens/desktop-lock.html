<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop kilit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="specimen.css"><script src="theme.js"></script>
<style>
  body { background: var(--canvas); }
  .lock { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; border-bottom: 1px solid var(--border); }
  .biz { display: flex; gap: 12px; align-items: center; }
  .biz img { width: 32px; height: 32px; }
  .biz b { font-size: 16px; }
  .clock { font: 600 16px/24px var(--font); color: var(--text-2); }
  .center { display: grid; grid-template-columns: 320px 360px; gap: 64px; justify-content: center; align-content: center; padding: 32px 16px; }
  .who h1 { font: 800 32px/38px var(--font); letter-spacing: -.02em; margin: 8px 0 4px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font: 800 24px/1 var(--font); }
  .role { color: var(--text-2); }
  .switch { margin-top: 24px; }
  .others { margin-top: 12px; display: grid; gap: 4px; }
  .others button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: var(--r-field); border: 1px solid transparent; background: transparent; text-align: left; cursor: pointer; }
  .others button:hover { background: var(--surface-muted); }
  .others .mini { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-muted); font: 700 13px/1 var(--font); }
  .others small { color: var(--text-2); margin-left: auto; font-size: 13px; }
  .pinbox { display: grid; gap: 16px; }
  .pinlabel { font: 600 14px/20px var(--font); }
  .dots { display: flex; gap: 14px; height: 56px; align-items: center; justify-content: center; border: 1px solid var(--bad-fg); border-radius: var(--r-panel); background: var(--surface); }
  .dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); }
  .dots span.on { background: var(--text); border-color: var(--text); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { min-height: 72px; border-radius: var(--r-panel); border: 1px solid var(--border); background: var(--surface); font: 600 26px/1 var(--font); cursor: pointer; font-variant-numeric: tabular-nums; }
  .pad button:hover { background: var(--surface-muted); }
  .pad button:active { transform: scale(.98); }
  .pad .fn { font-size: 15px; color: var(--text-2); }
  .bottom { padding: 16px 32px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-2); }
  @media (max-width: 820px) {
    .center { grid-template-columns: minmax(0, 360px); gap: 24px; }
    .others, .switch { display: none; }
    .top, .bottom { padding: 12px 16px; }
  }
</style>
</head>
<body>
<main class="lock" aria-label="Ekran kilitli">
  <header class="top">
    <div class="biz">
      <img src="../../../desktop/src/assets/brand/kasam360-ikon-kucuk-renkli.svg" alt="">
      <div><b>TEST_A Lokanta</b><div class="muted" style="font-size:13px">Kasa 1 · dev_a_01</div></div>
    </div>
    <div class="clock num">Cuma 6 Kasım · 14:32</div>
  </header>

  <section class="center">
    <div class="who">
      <span class="eyebrow">Ekran kilitlendi</span>
      <div style="display:flex;gap:16px;align-items:center;margin-top:16px">
        <div class="avatar" aria-hidden="true">AK</div>
        <div><h1>Ayşe Kaya</h1><div class="role">Kasiyer</div></div>
      </div>
      <p class="muted" style="margin-top:20px">Açık masa ve sepetler korunuyor.</p>
      <div class="switch eyebrow">Başka personel</div>
      <div class="others">
        <button type="button"><span class="mini">MD</span>Mert Demir<small>Müdür</small></button>
        <button type="button"><span class="mini">ZA</span>Zeynep Arslan<small>Garson</small></button>
        <button type="button"><span class="mini">CY</span>Can Yıldız<small>Kasiyer</small></button>
      </div>
    </div>

    <div class="pinbox">
      <div class="pinlabel" id="pinlbl">Ayşe Kaya için PIN</div>
      <div class="dots" role="img" aria-labelledby="pinlbl" aria-describedby="pin-err">
        <span class="on"></span><span class="on"></span><span></span><span></span>
      </div>
      <div id="pin-err" class="field-error" role="alert">PIN hatalı. 3 deneme kaldı; sonra 5 dakika beklenir.</div>
      <div class="pad" role="group" aria-label="PIN tuşları">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button class="fn" aria-label="Temizle">Temizle</button><button>0</button><button class="fn" aria-label="Son haneyi sil">Sil</button>
      </div>
      <button class="btn btn-primary" style="width:100%">Kilidi aç</button>
    </div>
  </section>

  <footer class="bottom">
    <span class="status ok">Yerel kayıt çalışıyor</span>
    <button class="btn btn-quiet" style="min-height:48px">Kasayı kapat ve çıkış yap</button>
  </footer>
</main>
<div class="specimen-tag">Tasarım örneği · sabit test verisi</div>
</body>
</html>
