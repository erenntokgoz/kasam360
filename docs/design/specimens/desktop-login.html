<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="specimen.css"><script src="theme.js"></script>
<style>
  .login { display: grid; grid-template-columns: minmax(320px, 38%) 1fr; min-height: 100vh; }
  .brand-side {
    background: var(--text); color: var(--canvas);
    padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
  }
  :root[data-theme="dark"] .brand-side { background: #0B1117; color: var(--text); border-right: 1px solid var(--border); }
  .brand-side .mark { display: flex; align-items: center; gap: 12px; font: 800 22px/28px var(--font); letter-spacing: -.01em; }
  .brand-side .mark img { width: 40px; height: 40px; background: #fff; border-radius: 10px; padding: 3px; }
  .brand-side h1 { font: 800 44px/48px var(--font); letter-spacing: -.03em; margin: 0; max-width: 11ch; }
  .brand-side .rule { width: 48px; height: 4px; background: #FF5A1F; margin-bottom: 20px; }
  .brand-side .ver { font-size: 13px; opacity: .7; }
  .form-side { display: grid; place-items: center; padding: 48px 24px; }
  .form { width: 100%; max-width: 420px; display: grid; gap: 20px; }
  .form h2 { font: 700 28px/34px var(--font); letter-spacing: -.02em; margin: 0; }
  .google { width: 100%; }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; color: var(--text-2); font-size: 13px; }
  .or::before, .or::after { content: ""; height: 1px; background: var(--border); }
  .pw { position: relative; }
  .pw .input { padding-right: 104px; }
  .pw button { position: absolute; right: 4px; top: 4px; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: var(--brand); font-weight: 600; cursor: pointer; }
  .form-error { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-field); background: var(--bad-bg); color: var(--bad-fg); border: 1px solid var(--bad-bd); font-size: 14px; line-height: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .row a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .submit { width: 100%; }
  .foot { font-size: 14px; color: var(--text-2); }
  .foot a { color: var(--brand); font-weight: 600; }
  @media (max-width: 760px) {
    .login { grid-template-columns: 1fr; }
    .brand-side { padding: 20px 16px; flex-direction: row; align-items: center; }
    .brand-side h1, .brand-side .rule, .brand-side .ver { display: none; }
    .form-side { place-items: start center; padding: 24px 16px; }
  }
</style>
</head>
<body>
<main class="login">
  <section class="brand-side" aria-label="KASAM360">
    <div class="mark"><img src="../../../desktop/src/assets/brand/kasam360-ikon-kucuk-renkli.svg" alt="">KASAM360</div>
    <div>
      <div class="rule"></div>
      <h1>Bu kasayı işletme hesabınıza bağlayın.</h1>
    </div>
    <div class="ver num">Sürüm 0.2.0</div>
  </section>

  <section class="form-side">
    <form class="form" onsubmit="return false" novalidate>
      <h2>Hesap girişi</h2>

      <button type="button" class="btn btn-secondary google">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12h8"/></svg>
        Google ile devam et
      </button>
      <div class="or">veya e-posta ile</div>

      <div class="form-error" role="alert">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
        <span><strong>Giriş yapılamadı.</strong> E-posta veya parola eşleşmedi. 4 deneme hakkınız kaldı.</span>
      </div>

      <div class="field">
        <label for="email">E-posta</label>
        <input id="email" class="input" type="email" value="owner.a@kasam360.invalid" autocomplete="username">
      </div>

      <div class="field">
        <label for="pw">Parola</label>
        <div class="pw">
          <input id="pw" class="input" type="password" value="" aria-invalid="true" aria-describedby="pw-err" autocomplete="current-password">
          <button type="button" aria-pressed="false" aria-controls="pw">Göster</button>
        </div>
        <div id="pw-err" class="field-error">Parolayı yeniden girin.</div>
      </div>

      <div class="row">
        <span></span>
        <a href="#">Parolamı unuttum</a>
      </div>

      <button class="btn btn-primary submit">Giriş yap</button>

      <p class="foot">Hesabınız yok mu? <a href="#">kasam360.com.tr üzerinden oluşturun</a></p>
    </form>
  </section>
</main>
<div class="specimen-tag">Tasarım örneği · sabit test verisi</div>
</body>
</html>
