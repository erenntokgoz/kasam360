name: kasam360-next

services:
  api:
    image: kasam360-api:${KASAM360_SHA:?Set KASAM360_SHA in deploy/.env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      SITE_URL: ${SITE_URL:?Set SITE_URL in deploy/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in deploy/.env}
      MONGODB_ACCOUNT_URI: ${MONGODB_ACCOUNT_URI:?Set a separate staging account URI}
      MONGODB_ACCOUNT_DB: ${MONGODB_ACCOUNT_DB:-kasam360_account_staging}
      MONGODB_BUSINESS_URI: ${MONGODB_BUSINESS_URI:?Set a separate staging business URI}
      MONGODB_BUSINESS_DB: ${MONGODB_BUSINESS_DB:-kasam360_business_staging}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in deploy/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LABS_SUPPORT_ORIGIN: http://labs:3600
      LABS_SUPPORT_TOKEN: ${LABS_SUPPORT_TOKEN:-}
      LABS_CATALOG_ORIGIN: http://labs:3600
      LABS_CATALOG_TOKEN: ${LABS_CATALOG_TOKEN:-}
      LABS_CUSTOMER_SECRET: ${LABS_CUSTOMER_SECRET:-}
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:4100:4000"

  web:
    image: kasam360-web:${KASAM360_SHA:?Set KASAM360_SHA in deploy/.env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"

  labs:
    image: labs360:${LABS360_SHA:?Set LABS360_SHA in deploy/.env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BIND_ADDR: 0.0.0.0:3600
      DATA_DIR: /data
      APP_ORIGIN: ${LABS_APP_ORIGIN:?Set LABS_APP_ORIGIN in deploy/.env}
      ADMIN_BOOTSTRAP_EMAIL: ${LABS_ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${LABS_ADMIN_BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:3610:3600"
    volumes:
      - labs-data:/data

volumes:
  labs-data:
