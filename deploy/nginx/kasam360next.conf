# KASAM360 yeni yığın (web, menü, API) Nginx sanal sunucuları.
# Neden: Eski uygulama ve Mailu bu dosyadan etkilenmesin diye yalnız kendi alan adlarımızı tanımlar.
# Bu dosya /etc/nginx/sites-available/ altına kopyalanır ve sites-enabled'a sembolik bağlanır.
# Başlangıçta yalnız 80 portu; TLS sertifikasını certbot --nginx ekler.

# WebSocket yükseltme: Connection başlığını yalnız Upgrade geldiğinde "upgrade" yapar.
# Değişken adı ortak Nginx yapılandırmasıyla çakışmasın diye önek taşır.
map $http_upgrade $kasam360next_connection_upgrade {
    default upgrade;
    ''      close;
}

# Web tanıtım sitesi, müşteri portalı ve QR menü (menu. alt alanı web içinde /m/ yoluna eşlenir).
# Host başlığı korunur; web uygulaması hangi alan adından geldiğini bu başlıkla ayırır.
server {
    listen 80;
    listen [::]:80;
    server_name kasam360.com.tr www.kasam360.com.tr menu.kasam360.com.tr;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kasam360next_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# API servisi. Görsel yüklemeleri için istek gövdesi 8 MB'a kadar kabul edilir.
server {
    listen 80;
    listen [::]:80;
    server_name api.kasam360.com.tr;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kasam360next_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
