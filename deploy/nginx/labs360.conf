# 360 Labs yönetim konsolu Nginx sanal sunucusu.
# Neden: Labs ayrı bir alan adında (360labs.com.tr) yayınlanır ve yalnız 127.0.0.1:3610 dinler.
# Bu dosya /etc/nginx/sites-available/ altına kopyalanır ve sites-enabled'a sembolik bağlanır.
# Başlangıçta yalnız 80 portu; TLS sertifikasını certbot --nginx ekler.

# WebSocket yükseltme: Connection başlığını yalnız Upgrade geldiğinde "upgrade" yapar.
map $http_upgrade $labs360_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 360labs.com.tr;

    location / {
        proxy_pass http://127.0.0.1:3610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $labs360_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
